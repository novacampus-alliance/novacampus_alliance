name: CI

on:
  push:
    branches: [main, develop, "m7-*", "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  ai-service:
    name: ai-service — build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Unit & smoke tests
        run: pytest tests/ -v
        env:
          LLM_PROVIDER: template
          JWT_SECRET: ci-test-secret

      - name: Docker build
        run: docker build -t novacampus-ai-service:ci .

      - name: Smoke test (container)
        run: |
          docker run -d --name ai-smoke -p 18000:8000 \
            -e LLM_PROVIDER=template \
            -e JWT_SECRET=ci-test-secret \
            novacampus-ai-service:ci
          for i in $(seq 1 15); do
            if curl -sf http://localhost:18000/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:18000/health | grep -q '"status":"ok"'
          curl -sf http://localhost:18000/api/v1/conflicts/llm/status | grep -q 'resolution-conflits-edt'
          docker logs ai-smoke
          docker stop ai-smoke
