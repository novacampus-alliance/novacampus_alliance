resolver 127.0.0.11 valid=30s ipv6=off;

# ─────────────────────────────────────────
# HTTP — redirection vers HTTPS
# (le challenge certbot se fait en mode standalone, nginx arrêté)
# ─────────────────────────────────────────
server {
    listen 80;
    server_name novacampus-alliance.cesilarochelle.fr;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────
# HTTPS — reverse proxy applicatif
# Certificats Let's Encrypt montés depuis le host (/etc/letsencrypt)
# ─────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name novacampus-alliance.cesilarochelle.fr;

    ssl_certificate     /etc/letsencrypt/live/novacampus-alliance.cesilarochelle.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novacampus-alliance.cesilarochelle.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    set $frontend frontend:3000;
    set $gateway  gateway:3000;

    location /_next/ {
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Routes auth gérées par Next.js (cookie httpOnly) — doit précéder /api/
    location /api/auth/ {
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass         http://$gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass         http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
