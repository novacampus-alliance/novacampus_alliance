services:
  # ─────────────────────────────────────────
  # PostgreSQL — données relationnelles
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: novacampus_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # MongoDB — données NoSQL
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7-jammy
    container_name: novacampus_mongodb
    restart: unless-stopped
    expose:
      - ${MONGO_PORT:-27017}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # Redis — cache & sessions
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: novacampus_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # API Gateway — routage SOA (point d'entrée unique)
  # ─────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: novacampus_gateway
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PORT: 3000
      ACADEMIC_SERVICE_URL: http://academic-service:3001
      BILLING_SERVICE_URL: http://billing-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      AI_SERVICE_URL: http://ai-service:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      NODE_ENV: production
    depends_on:
      - academic-service
      - billing-service
      - notification-service
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # Svc Académique — auth, campus, cours (NestJS)
  # ─────────────────────────────────────────
  academic-service:
    build:
      context: .
      dockerfile: services/academic-service/Dockerfile
    container_name: novacampus_academic
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # Svc Facturation — paiements, factures (NestJS)
  # ─────────────────────────────────────────
  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    container_name: novacampus_billing
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      PORT: 3002
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # MailHog — catch-all SMTP (dev uniquement)
  # ─────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: novacampus_mailhog
    restart: unless-stopped
    expose:
      - "1025"
    ports:
      - "8025:8025"
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # Svc Notification — alertes, emails (NestJS)
  # ─────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: novacampus_notification
    restart: unless-stopped
    expose:
      - "3003"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: '"NovaCampus" <no-reply@novacampus.fr>'
      PORT: 3003
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # Frontend — Next.js (portails IHM)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://gateway:3000}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
    container_name: novacampus_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://gateway:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NODE_ENV: production
    depends_on:
      - gateway
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # Nginx — reverse proxy (point d'entrée HTTP)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: novacampus_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gateway
    networks:
      - novacampus_network

  # ─────────────────────────────────────────
  # Svc IA — FastAPI (agent résolution conflits EDT)
  # ─────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: novacampus_ai_service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DEBUG: ${AI_DEBUG:-false}
      PORT: 8000
      LLM_PROVIDER: ${LLM_PROVIDER:-template}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
      MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017
      MONGODB_DB: ${AI_MONGODB_DB:-novacampus_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BACKEND_URL: http://gateway:3000
      JWT_SECRET: ${JWT_SECRET:-change_me_with_a_strong_secret}
      ALLOWED_ORIGINS: '["http://localhost","http://localhost:8080"]'
    depends_on:
      gateway:
        condition: service_started
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - novacampus_network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  novacampus_network:
    driver: bridge
